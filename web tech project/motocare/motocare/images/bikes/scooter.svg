<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="scooterGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="#131B2A"/>
  <!-- Ground line -->
  <line x1="30" y1="200" x2="370" y2="200" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Rear Wheel (smaller scooter tire) -->
  <circle cx="110" cy="172" r="28" stroke="#94A3B8" stroke-width="7" fill="#1E293B"/>
  <circle cx="110" cy="172" r="11" fill="#64748B"/>
  <!-- Front Wheel -->
  <circle cx="295" cy="172" r="28" stroke="#94A3B8" stroke-width="7" fill="#1E293B"/>
  <circle cx="295" cy="172" r="11" fill="#64748B"/>
  <!-- Scooter step-through floorboard -->
  <path d="M150 178 L220 178 L230 145 L150 150 Z" fill="#334155"/>
  <!-- Rear Body / Engine Cover -->
  <path d="M85 170 C85 130 115 125 155 125 L165 175 Z" fill="url(#scooterGrad)"/>
  <!-- Long Scooter Seat -->
  <path d="M100 125 C125 120 160 120 180 125 C175 133 115 133 100 125 Z" fill="#0F172A"/>
  <!-- Front Apron & Steering Column -->
  <path d="M220 175 L255 105 C260 95 275 95 285 105 L265 172 Z" fill="url(#scooterGrad)"/>
  <!-- Handlebars & Headlamp -->
  <line x1="250" y1="90" x2="275" y2="90" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="275" cy="98" r="6" fill="#FACC15"/>
</svg>
