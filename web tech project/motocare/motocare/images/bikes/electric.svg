<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="evGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="evCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="16" fill="#131B2A"/>
  <!-- Ground line -->
  <line x1="30" y1="200" x2="370" y2="200" stroke="#334155" stroke-width="3" stroke-linecap="round"/>
  <!-- Rear Aero Wheel -->
  <circle cx="105" cy="170" r="30" stroke="#10B981" stroke-width="4" fill="#1E293B"/>
  <circle cx="105" cy="170" r="16" fill="#334155"/>
  <!-- Front Aero Wheel -->
  <circle cx="295" cy="170" r="30" stroke="#10B981" stroke-width="4" fill="#1E293B"/>
  <circle cx="295" cy="170" r="16" fill="#334155"/>
  <!-- Underfloor Battery Pack (Glowing Green) -->
  <rect x="150" y="155" width="70" height="24" rx="4" fill="#064E3B" stroke="#10B981" stroke-width="2"/>
  <polygon points="187,159 180,167 186,167 183,175 192,165 186,165" fill="#34D399"/>
  <!-- Sleek EV Body -->
  <path d="M95 160 C95 125 125 120 160 120 L225 120 L275 105 L260 170 Z" fill="url(#evGrad)"/>
  <!-- Minimalist EV Seat -->
  <path d="M120 115 C145 112 185 112 210 115 C205 122 135 122 120 115 Z" fill="#0F172A"/>
  <!-- Digital Cockpit & LED DRL strip -->
  <line x1="260" y1="95" x2="280" y2="95" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round"/>
  <line x1="275" y1="102" x2="285" y2="102" stroke="#06B6D4" stroke-width="3" stroke-linecap="round"/>
</svg>
