<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="mcOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F74418"/>
    </linearGradient>
    <linearGradient id="mcSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#A0AEC0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Icon: Stylized Gear & Motorcycle Wing / Wrench -->
  <g transform="translate(6, 6)">
    <!-- Hex / Gear Badge Background -->
    <polygon points="26,2 48,14 48,38 26,50 4,38 4,14" fill="#161F30" stroke="url(#mcOrange)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Stylized Speed Wing / Piston Shape -->
    <path d="M 12 30 L 26 12 L 40 30 L 32 30 L 26 22 L 20 30 Z" fill="url(#mcOrange)"/>
    <circle cx="26" cy="35" r="4" fill="url(#mcSilver)"/>
    <path d="M 16 38 Q 26 44 36 38" stroke="url(#mcOrange)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography: MotoCare -->
  <text x="68" y="38" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="0.5">
    <tspan fill="#FFFFFF">MOTO</tspan><tspan fill="url(#mcOrange)">CARE</tspan>
  </text>
  
  <!-- Slogan Badge -->
  <text x="70" y="52" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="8.5" fill="#94A3B8" letter-spacing="2">
    TWO-WHEELER SERVICE &amp; REPAIR
  </text>
</svg>
